[project]
name = "lzh-pipeline"
version = "0.1.0"
description = "Builds the static data files for the Classical Chinese (lzh) explorer site."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lzh-build = "lzh_pipeline.build:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lzh_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

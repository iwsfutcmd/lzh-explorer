# Function words (虛詞) of Classical and Early Vernacular Chinese.
#
# Compiled for this project. Category scheme after the usual grammatical
# descriptions (e.g. Pulleyblank 1995, Outline of Classical Chinese Grammar;
# Rabinovich 2010; Meisterernst 2016; Wang Li 王力 et al., 古代漢語).
#
# Tagging is by *type*: a character is listed if grammatical uses are a major
# part of its usage, not if every token of it is grammatical (之 is also the
# verb "go"; 夫 is also the noun "man"). The token-level picture comes from the
# part-of-speech profiles (UD Kyoto treebank) shown next to it on the site.
# `pipeline/lzh_pipeline/function_words.py --check` compares each entry with
# the treebank.
#
# Each entry: categories, most important first. `vernacular = true` marks
# items whose grammatical use belongs to Early Vernacular / baihua rather than
# Classical usage (relevant for the six novels; the Classical treebank cannot
# confirm them).
#
# Excluded after checking against the treebank, because content uses dominate:
# 伊 胡 維 (mostly names/nouns), 惡 亡 微 云 方 (mostly content words),
# 見 庶 克 使 (auxiliary/causative use marginal), 係 底 (rare in these senses).
# Kept although the treebank tags them mostly VERB, as the grammars treat them
# as negatives/coverbs: 無 否 靡 罔 在 從 向 如 及.
#
# Categories:
#   pron     personal and reflexive pronouns
#   dem      demonstratives
#   interr   interrogatives
#   neg      negatives
#   prep     prepositions / coverbs
#   conj     conjunctions and clause connectives
#   final    sentence-final particles
#   initial  initial and modal particles
#   struct   structural particles, nominalizers, suffixes
#   adv      grammatical adverbs (aspect, scope, degree, modality)
#   aux      auxiliary and modal verbs
#   copula   copulas


# Curated metadata for the texts in the Schalmey (2021) frequency dataset.
#
# Each table is keyed by the text title *exactly as it appears* in the
# dataset's CSV headers (`source_title`). Where the dataset's title contains
# a typo or a non-standard variant character, `title` gives the normalized
# traditional-character title shown in the UI; the original is kept so that
# the mapping is auditable.
#
#   id       stable ASCII slug used in URLs and data files
#   title    normalized title (traditional characters)
#   pinyin   Hanyu Pinyin of the title
#   en       English title / gloss
#   year     completion year for the official histories, as given in the
#            dataset's zhengshi_corpus.csv (negative = BCE). Omitted where the
#            dataset gives none: dating of early texts is contested and we do
#            not want to invent precision.
#   note     why `title` differs from `source_title`, if it does

# ---------------------------------------------------------------- Loewe ----

